<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잔향 회로 · 유리 온실</title><link rel="stylesheet" href="style.css">
<body><canvas id="effects" aria-hidden="true"></canvas><main><header><span class="eyebrow">GLASSHOUSE / CIRCUIT 07</span><h1>잔향 회로</h1><p>사라진 빛이 다음 빛을 깨웁니다.</p></header>
<section class="glass enemy" id="enemy"><div class="habitat" aria-hidden="true"><span class="sector">SPECIMEN / 07<br>UMBRA FLORA</span><svg class="creature" viewBox="0 0 440 240"><defs><radialGradient id="aura"><stop stop-color="#78ffe0" stop-opacity=".35"/><stop offset="1" stop-color="#78ffe0" stop-opacity="0"/></radialGradient><linearGradient id="crystal" x2="1" y2="1"><stop stop-color="#d5fff0"/><stop offset=".4" stop-color="#39a8a2"/><stop offset="1" stop-color="#102f48"/></linearGradient></defs><ellipse cx="220" cy="125" rx="180" ry="112" fill="url(#aura)"/><g fill="none" stroke="#9fdfca" opacity=".16"><path d="M20 230V80L220 0 420 80V230M80 230V90L220 20 360 90V230M140 230V100L220 40 300 100V230M0 220H440M0 190H440"/><ellipse cx="220" cy="205" rx="130" ry="22"/></g><g class="boss-body" stroke="#92e8ca" stroke-width="1"><path d="M220 174 109 147 59 79 146 101 174 61 207 103Z" fill="#164c53"/><path d="M220 174 331 147 381 79 294 101 266 61 233 103Z" fill="#164c53"/><path d="M220 174 129 119 110 39 184 86 220 23 256 86 330 39 311 119Z" fill="url(#crystal)"/><path d="M220 23 220 174 184 86M220 174 256 86M110 39 220 174 330 39" fill="none" opacity=".5"/><path d="M220 80 254 128 220 184 186 128Z" fill="#072e36"/><path d="M220 103 235 127 220 151 205 127Z" fill="#e0ffe5" stroke="#fff"/><path d="M220 184 201 205 220 219 239 205Z" fill="#5dc7b0"/><g fill="none" opacity=".6"><path d="M109 147 91 182 126 202M331 147 349 182 314 202M174 61 162 30M266 61 278 30"/></g></g></svg><span class="specimen-tag">유리꽃 · 침식체</span></div><div class="line"><h2>온실의 그림자</h2><span id="turn"></span></div><progress id="boss" aria-label="보스 체력"></progress><div class="line"><span id="bossText"></span><strong id="incoming"></strong></div></section>
<section class="glass circuit"><div class="line"><strong id="health"></strong><span id="taps"></span></div><p id="pending"></p><div id="board" role="group" aria-label="6열 7행 빛 회로. 방향키 이동, Enter 또는 Space 확정"></div><p id="preview">타일을 누르거나 키보드로 선택하면 연결을 미리 봅니다.</p><p id="echo"></p></section>
<section class="glass controls"><div class="line"><label for="gauge">과충전</label><span id="gaugeText"></span></div><progress id="gauge"></progress><button id="boost">빛 증폭 · 이번 턴 피해 ×2</button><div class="skills"><button data-skill="0"><span class="skill-icon">◇</span>굴절사<br><small>파랑 → 산호</small></button><button data-skill="1"><span class="skill-icon">✹</span>점화사<br><small>일반 공격 2개 → 폭탄</small></button><button data-skill="2"><span class="skill-icon">❧</span>정원사<br><small>일반 공격 6개 → 회복</small></button></div><p id="notice" role="status" aria-live="polite">빛 회로를 연결해 온실을 복구하세요.</p></section>
<footer><button id="help">규칙 보기</button><button id="restart">같은 시드 재시작</button><button id="newSeed">새 시드</button><p>소리 없음 · 외부 통신 없음 · 색과 모양으로 구분</p></footer>
<dialog id="guide"><span class="eyebrow" id="step"></span><h2 id="guideTitle"></h2><p id="guideText"></p><button id="guideNext">다음</button></dialog>
<dialog id="ending"><div class="end-emblem" aria-hidden="true">✧</div><span class="eyebrow">GLASSHOUSE / FIELD RECORD</span><h2 id="result"></h2><p id="stats"></p><button id="again">같은 회로 다시</button><button id="another">새 회로 시작</button></dialog>
</main><script type="module" src="app.mjs"></script></body></html>
